# Runs the game server and the web app side by side.
#   docker compose up -d --build
# Both listen on 127.0.0.1 only; put a reverse proxy or tunnel in front.
# Ports on the host can be changed with SERVER_PORT / WEB_PORT.
services:
  server:
    build: ./server
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"

  web:
    build:
      context: ./app
      args:
        SERVER_URL: ${SERVER_URL:-wss://puzzer.deadgroup.dev}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:80"
